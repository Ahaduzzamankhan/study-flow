name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: false
        default: ''
      publish_release:
        description: 'Publish a GitHub release with the installer (creates the v* tag if missing)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build and release Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } elseif ("${{ github.event.inputs.version }}" -ne "") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = (Get-Content package.json | ConvertFrom-Json).version
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building StudyFlow $version"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build renderer and main process
        run: npm run build

      - name: Package Electron application
        run: npx electron-builder --win --dir --publish never

      - name: Verify packaged application
        shell: pwsh
        run: |
          if (-not (Test-Path "release/win-unpacked/StudyFlow.exe")) {
            throw "Packaged application missing at release/win-unpacked/StudyFlow.exe"
          }
          if (-not (Test-Path "release/win-unpacked/resources/app.asar")) {
            throw "Packaged app.asar missing"
          }

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
          Write-Host "Using $iscc"

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" "installer\studyflow.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          if (-not (Test-Path "release/StudyFlow-Setup-$version.exe")) {
            throw "Installer was not produced"
          }

      - name: Create portable archive
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/StudyFlow-Portable-$version.zip" -CompressionLevel Optimal

      - name: Generate checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $lines = @(
            (Get-FileHash "release/StudyFlow-Setup-$version.exe" -Algorithm SHA256).Hash + "  StudyFlow-Setup-$version.exe",
            (Get-FileHash "release/StudyFlow-Portable-$version.zip" -Algorithm SHA256).Hash + "  StudyFlow-Portable-$version.zip"
          )
          $lines | Out-File -Encoding ascii "release/StudyFlow-SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studyflow-windows
          path: |
            release/StudyFlow-Setup-*.exe
            release/StudyFlow-Portable-*.zip
            release/StudyFlow-SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: StudyFlow ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release/StudyFlow-Setup-*.exe
            release/StudyFlow-Portable-*.zip
            release/StudyFlow-SHA256SUMS.txt
          body: |
            ## StudyFlow ${{ steps.version.outputs.version }}

            Offline desktop study manager: Pomodoro timer, session tracking, subjects, tasks, goals, habits, notes, achievements and analytics.

            ### Install (Windows 10/11, x64)
            1. Download `StudyFlow-Setup-${{ steps.version.outputs.version }}.exe`.
            2. Run it and choose an install directory.
            3. Launch StudyFlow from the Start Menu or desktop shortcut.

            The installer is compiled with Inno Setup. A portable build (`StudyFlow-Portable-${{ steps.version.outputs.version }}.zip`) is also attached.
            Verify downloads with `StudyFlow-SHA256SUMS.txt`.

            Your study history is stored locally in `%APPDATA%\StudyFlow` and is preserved across upgrades and uninstall.
